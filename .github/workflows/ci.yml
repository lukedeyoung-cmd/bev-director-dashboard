name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bev
          POSTGRES_USER: bev
          POSTGRES_PASSWORD: bev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://bev:bev@localhost:5432/bev
      SECRET_KEY: ci-secret-key-not-used-in-production
      SESSION_COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Migrations (upgrade / downgrade / upgrade on Postgres)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -q
